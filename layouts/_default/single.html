{{ define "main" }}
<div class="container">
  <article>
    {{ partial "breadcrumbs.html" . }}
    <h1 class="article-title">{{ .Title }}</h1>
    {{ with .Date }}<div class="article-meta">{{ .Format "Jan 2, 2006" }}</div>{{ end }}
    {{ with .Params.tags }}<div class="tag-list">{{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}">{{ . }}</a>{{ end }}</div>{{ end }}
    <div>{{ .Content }}</div>
  </article>
</div>
{{ end }}
