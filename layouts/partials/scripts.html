{{ $darkmode := resources.Get "js/darkmode.js" | resources.Minify | resources.Fingerprint }}
<script defer src="{{ $darkmode.RelPermalink }}"></script>
{{ if .Store.Get "hasMermaid" }}
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){var c=getComputedStyle(document.documentElement).getPropertyValue("--gray").trim();mermaid.initialize({startOnLoad:true,theme:'base',themeVariables:{fontFamily:'"Source Sans 3",system-ui,sans-serif',lineColor:c,arrowheadColor:c}})});</script>
{{ end }}
<script>document.addEventListener("click",function(e){var b=e.target.closest(".clipboard-button");if(!b||b.classList.contains("copied"))return;var c=b.closest(".code-container,.mermaid-container");if(!c)return;var p=c.querySelector("pre");if(!p)return;navigator.clipboard.writeText(p.textContent);var t=b.innerHTML;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';b.classList.add("copied");setTimeout(function(){b.innerHTML=t;b.classList.remove("copied")},2000)});</script>
<script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>var pb=document.getElementById("progress-bar");if(pb){function upP(){var d=document.documentElement;var sc=d.scrollTop||document.body.scrollTop;var mh=(d.scrollHeight||document.body.scrollHeight)-d.clientHeight;pb.style.width=(mh>0?(sc/mh)*100:0)+"%"}document.addEventListener("scroll",upP,{passive:true});upP()}</script>
<script>var tt=document.getElementById("to-top");if(tt){document.addEventListener("scroll",function(){tt.classList.toggle("visible",(document.documentElement.scrollTop||document.body.scrollTop)>400)},{passive:true});tt.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})})}</script>
<script>var lb=document.getElementById("lightbox");if(lb){var li=document.getElementById("lightbox-img");var lc=document.getElementById("lightbox-caption");function closeLb(){lb.hidden=true;document.body.style.overflow="";li.src=""}document.addEventListener("click",function(e){var im=e.target.closest("main img");if(!im)return;li.src=im.currentSrc||im.src;lc.textContent=im.alt||"";lb.hidden=false;document.body.style.overflow="hidden"});lb.addEventListener("click",function(e){if(e.target===lb||e.target.closest(".lightbox-close"))closeLb()});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!lb.hidden)closeLb()})}</script>
<script>var fuse;function initSearch(){if(fuse)return;fetch("/index.json").then(function(r){return r.json()}).then(function(d){fuse=new Fuse(d,{keys:["title","content","tags"],threshold:0.4,includeScore:true,minMatchCharLength:2})})}function toggleSearch(){var o=document.getElementById("search-overlay");o.classList.toggle("open");if(o.classList.contains("open")){initSearch();var i=document.getElementById("search-input");i.value="";i.focus();document.getElementById("search-results").innerHTML=""}}function closeSearch(e){e.target===e.currentTarget&&document.getElementById("search-overlay").classList.remove("open")}document.addEventListener("DOMContentLoaded",function(){document.getElementById("search-input").addEventListener("input",function(){var q=this.value.trim();var r=document.getElementById("search-results");if(!q||!fuse){r.innerHTML="";return}var res=fuse.search(q).slice(0,10);r.innerHTML=res.map(function(m){var item=m.item;var snippet=item.content.substring(0,150);return'<a href="'+item.url+'" class="search-result"><div class="search-result-title">'+item.title+'</div><div class="search-result-snippet">'+snippet+'...</div></a>'}).join("")})});document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var o=document.getElementById("search-overlay");if(o.classList.contains("open"))o.classList.remove("open")});document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();toggleSearch()}});</script>
{{ if .Store.Get "hasMermaid" }}
<script>document.addEventListener("click",function(e){var b=e.target.closest(".mermaid-fullscreen-btn");if(!b)return;var c=b.closest(".mermaid-container");if(!c)return;var s=c.querySelector(".mermaid svg");if(!s)return;var o=c.querySelector(".mermaid-overlay");var t=o.querySelector(".mermaid-content");t.innerHTML="";t.appendChild(s.cloneNode(true));o.classList.add("active");document.body.style.overflow="hidden"});document.addEventListener("click",function(e){var o=e.target.closest(".mermaid-overlay");if(!o||!o.classList.contains("active"))return;if(e.target===o||e.target.closest(".close-btn")){o.classList.remove("active");document.body.style.overflow=""}});document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var o=document.querySelector(".mermaid-overlay.active");if(!o)return;o.classList.remove("active");document.body.style.overflow=""});</script>
{{ end }}
