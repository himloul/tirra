{{ if .Store.Get "hasMermaid" }}
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){var c=getComputedStyle(document.documentElement).getPropertyValue("--gray").trim();mermaid.initialize({startOnLoad:true,theme:'base',themeVariables:{fontFamily:'"Source Sans 3",system-ui,sans-serif',lineColor:c,arrowheadColor:c}})});</script>
{{ end }}
<script>document.addEventListener("click",function(e){var b=e.target.closest(".clipboard-button");if(!b||b.classList.contains("copied"))return;var c=b.closest(".code-container,.mermaid-container");if(!c)return;var p=c.querySelector("pre");if(!p)return;navigator.clipboard.writeText(p.textContent);var t=b.innerHTML;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';b.classList.add("copied");setTimeout(function(){b.innerHTML=t;b.classList.remove("copied")},2000)});</script>
<script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>var pb=document.getElementById("progress-bar");if(pb){function upP(){var d=document.documentElement;var sc=d.scrollTop||document.body.scrollTop;var mh=(d.scrollHeight||document.body.scrollHeight)-d.clientHeight;pb.style.width=(mh>0?(sc/mh)*100:0)+"%"}document.addEventListener("scroll",upP,{passive:true});upP()}</script>
<script>var tt=document.getElementById("to-top");if(tt){document.addEventListener("scroll",function(){tt.classList.toggle("visible",(document.documentElement.scrollTop||document.body.scrollTop)>400)},{passive:true});tt.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})})}</script>
<script>var lb=document.getElementById("lightbox");if(lb){var li=document.getElementById("lightbox-img");var lc=document.getElementById("lightbox-caption");function closeLb(){lb.hidden=true;document.body.style.overflow="";li.src=""}document.addEventListener("click",function(e){var im=e.target.closest("main img");if(!im)return;li.src=im.currentSrc||im.src;lc.textContent=im.alt||"";lb.hidden=false;document.body.style.overflow="hidden"});lb.addEventListener("click",function(e){if(e.target===lb||e.target.closest(".lightbox-close"))closeLb()});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!lb.hidden)closeLb()})}</script>
<script>var fuse,fusePending=false;function initSearch(){if(fuse||fusePending)return;fusePending=true;fetch("/index.json").then(function(r){return r.json()}).then(function(d){fuse=new Fuse(d,{keys:["title","content","tags"],threshold:0.4,includeScore:true,includeMatches:true,minMatchCharLength:2});fusePending=false;var i=document.getElementById("search-input");if(i&&i.value.trim())runSearch(i.value.trim())})}function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}function hilite(text,ranges){if(!ranges||!ranges.length)return esc(text);var out="",last=0;for(var i=0;i<ranges.length;i++){var st=ranges[i][0],en=ranges[i][1]+1;if(en<=last)continue;out+=esc(text.slice(last,st))+"<mark>"+esc(text.slice(st,en))+"</mark>";last=en}return out+esc(text.slice(last))}function snippet(content,ranges){var text=content;var r=ranges&&ranges.length?ranges:[];var anchor=r.length?r[0]:null;var start=anchor?Math.max(0,anchor[0]-40):0;var end=anchor?Math.min(text.length,anchor[1]+110):Math.min(text.length,150);if(!anchor&&text.length<=150)return esc(text);var shifted=[];for(var i=0;i<r.length;i++){var st=Math.max(0,r[i][0]-start),en=Math.min(text.length-start,r[i][1]-start);if(en>st)shifted.push([st,en])}return (start>0?"\u2026":"")+hilite(text.slice(start,end),shifted)+(end<text.length?"\u2026":"")}function runSearch(q){var r=document.getElementById("search-results");var res=fuse.search(q).slice(0,10);if(!res.length){r.innerHTML='<div class="search-status">No results for \u201c'+esc(q)+'\u201d</div>';return}r.innerHTML=res.map(function(m){var item=m.item,tR=null,cR=null;if(m.matches)m.matches.forEach(function(mt){if(mt.key==="title")tR=mt.indices;else if(mt.key==="content")cR=mt.indices});return'<a href="'+item.url+'" class="search-result"><div class="search-result-title">'+hilite(item.title,tR)+'</div><div class="search-result-snippet">'+snippet(item.content,cR)+'</div></a>'}).join("")}function closeSearchOverlay(){var o=document.getElementById("search-overlay");if(!o||!o.classList.contains("open"))return;o.classList.remove("open");var b=document.querySelector(".search-btn");if(b)b.focus()}function toggleSearch(){var o=document.getElementById("search-overlay");o.classList.toggle("open");if(o.classList.contains("open")){initSearch();var i=document.getElementById("search-input");i.value="";i.focus();document.getElementById("search-results").innerHTML='<div class="search-status">Type to search</div>'}}function closeSearch(e){if(e.target===e.currentTarget)closeSearchOverlay()}document.addEventListener("DOMContentLoaded",function(){document.getElementById("search-input").addEventListener("input",function(){var q=this.value.trim();var r=document.getElementById("search-results");if(!q){r.innerHTML='<div class="search-status">Type to search</div>';return}if(!fuse){r.innerHTML='<div class="search-status">Loading\u2026</div>';return}runSearch(q)})});document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSearchOverlay();else if(e.key==="Tab"){var o=document.getElementById("search-overlay");if(!o||!o.classList.contains("open"))return;var els=o.querySelectorAll("a[href],input,button");if(!els.length)return;var first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();toggleSearch()}});window.addEventListener("pageshow",function(){var o=document.getElementById("search-overlay");if(o&&o.classList.contains("open"))o.classList.remove("open")});</script>

<script>document.addEventListener("click",function(e){var b=e.target.closest(".mermaid-fullscreen-btn");if(!b)return;var c=b.closest(".mermaid-container");if(!c)return;var s=c.querySelector(".mermaid svg");if(!s)return;var o=c.querySelector(".mermaid-overlay");var t=o.querySelector(".mermaid-content");t.innerHTML="";t.appendChild(s.cloneNode(true));o.classList.add("active");document.body.style.overflow="hidden"});document.addEventListener("click",function(e){var o=e.target.closest(".mermaid-overlay");if(!o||!o.classList.contains("active"))return;if(e.target===o||e.target.closest(".close-btn")){o.classList.remove("active");document.body.style.overflow=""}});document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;var o=document.querySelector(".mermaid-overlay.active");if(!o)return;o.classList.remove("active");document.body.style.overflow=""});</script>
{{ end }}
