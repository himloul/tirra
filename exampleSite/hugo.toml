baseURL = "https://example.org/"
title = "tirra"
theme = "tirra"
defaultContentLanguage = "en"
enableRobotsTXT = true

[params]
  description = "A single-column Hugo theme for reading: warm palettes, dark mode, search, and a small set of page features."
  author = "tirra"

  [params.social]
    github = "your-github"

  [params.theme]

    [params.theme.font.google]
      body = "Source Sans 3"
      heading = "Crimson Pro"

    # Palette defaults live in themes/tirra/assets/css/main.css.
    # Config overrides them; e.g.:
    # [params.theme.color]
    #   light = "#fff"

    # Analytics: set your Plausible domain to enable.
    # [params.analytics]
    #   plausible = "your-domain.example.org"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON", "WEBMANIFEST"]

[outputFormats.WEBMANIFEST]
  mediaType = "application/manifest+json"
  baseName = "manifest"
  isHTML = false
  noUgly = true

[markup]
  _merge = "deep"
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [["\\[", "\\]"], ["$$", "$$"]]
      inline = [["\\(", "\\)"], ["$", "$"]]
